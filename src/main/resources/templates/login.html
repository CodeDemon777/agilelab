<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In - AgileLab</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <link rel="stylesheet" th:href="@{/css/LogIn.css}">
</head>
<body>
  <div class="login-page-container">
    <div class="login-card">
      <div style="text-align: center; margin-bottom: 1.5rem;">
        <a th:href="@{/}" class="brand-container" style="justify-content: center; margin-bottom: 0.75rem;">
          <div class="brand-logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
              <path d="M8 10h.01"></path>
              <path d="M12 10h.01"></path>
              <path d="M16 10h.01"></path>
            </svg>
          </div>
          <span class="brand-name">AgileLab</span>
        </a>
        <h2 class="login-title">Welcome Back</h2>
        <p class="login-subtitle">Sign in to access your team chat and sprint intelligence.</p>
      </div>

      <!-- Alerts -->
      <div th:if="${errorMessage != null}" class="alert error" th:text="${errorMessage}"></div>
      <div th:if="${successMessage != null}" class="alert success" th:text="${successMessage}"></div>

      <!-- 1-Click Demo Box -->
      <div class="demo-box">
        <p class="demo-title">⚡ 1-Click Instant Demo Login:</p>
        <div style="display: flex; gap: 0.4rem; flex-wrap: wrap;">
          <button type="button" class="demo-user-pill" onclick="fillDemo('johndoe', 'password123')">John Doe</button>
          <button type="button" class="demo-user-pill" onclick="fillDemo('alice', 'password123')">Alice</button>
          <button type="button" class="demo-user-pill" onclick="fillDemo('bob', 'password123')">Bob</button>
          <button type="button" class="demo-user-pill" onclick="fillDemo('emma', 'password123')">Emma</button>
        </div>
      </div>

      <form th:action="@{/login}" method="post">
        <div class="form-group">
          <label for="username-field" class="form-label">Username or Email</label>
          <input type="text" id="username-field" name="username" placeholder="Enter username or email..." class="input-field" required autofocus />
        </div>

        <div class="form-group" style="margin-bottom: 1.5rem;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 0.35rem;">
            <label for="password-field" class="form-label" style="margin:0;">Password</label>
            <span style="font-size:0.78rem; color:var(--text-light);">demo: password123</span>
          </div>
          <input type="password" id="password-field" name="password" placeholder="••••••••" class="input-field" required />
        </div>

        <button type="submit" class="btn-submit">Sign In</button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.88rem; color: var(--text-muted);">
        Don't have an account? <a th:href="@{/signup}" style="color: var(--primary); font-weight: 600; text-decoration: none;">Create one free</a>
      </div>
    </div>
  </div>

  <script>
    function fillDemo(username, password) {
      document.getElementById('username-field').value = username;
      document.getElementById('password-field').value = password;
    }
  </script>
</body>
</html>
