<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - AgileLab</title>
  <link rel="stylesheet" href="/css/LogIn.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body style="display:flex; justify-content:center; align-items:center; min-height:100vh; background-color: var(--bg-page);">
  <div class="login-card">
    <div style="text-align: center; margin-bottom: 1.5rem;">
      <a href="/index.html" class="brand-container" style="justify-content: center; margin-bottom: 0.5rem;">
        <div class="brand-logo">💬</div>
        <span class="brand-name">AgileLab</span>
      </a>
      <h2 class="login-title" style="margin: 0; font-size: 1.5rem;">Welcome Back</h2>
      <p style="color: #64748b; font-size: 0.88rem; margin: 4px 0 0;">Log in to access your chats &amp; AI workspace</p>
    </div>

    <!-- Alert Box -->
    <div id="login-alert" class="alert error" style="display:none;"></div>

    <!-- Demo Credentials Quick-Fill -->
    <div style="background-color: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 8px; padding: 0.75rem; margin-bottom: 1.25rem;">
      <p style="margin: 0 0 0.4rem 0; font-size: 0.75rem; font-weight: 700; color: #475569; text-transform: uppercase;">1-Click Demo Login:</p>
      <div style="display: flex; gap: 0.4rem; flex-wrap: wrap;">
        <button type="button" class="demo-user-pill" onclick="quickFill('johndoe')">👤 John Doe</button>
        <button type="button" class="demo-user-pill" onclick="quickFill('alice')">👩 Alice</button>
        <button type="button" class="demo-user-pill" onclick="quickFill('bob')">👨 Bob</button>
        <button type="button" class="demo-user-pill" onclick="quickFill('emma')">👩 Emma</button>
      </div>
    </div>

    <!-- Login Form -->
    <form id="login-form" onsubmit="handleLogin(event)">
      <div style="margin-bottom: 1rem;">
        <label for="username" style="display: block; font-weight: 600; font-size: 0.85rem; color: #334155; margin-bottom: 4px;">Username or Email</label>
        <input type="text" id="username" class="input-field" placeholder="Enter username..." required autofocus style="margin: 0;">
      </div>

      <div style="margin-bottom: 1.5rem;">
        <label for="password" style="display: block; font-weight: 600; font-size: 0.85rem; color: #334155; margin-bottom: 4px;">Password</label>
        <input type="password" id="password" class="input-field" placeholder="••••••••" required style="margin: 0;">
      </div>

      <button type="submit" id="btn-login-submit" class="btn-submit" style="width: 100%; padding: 0.75rem; font-weight: 700;">
        Log In
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.88rem; color: #64748b;">
      Don't have an account? <a href="/signup.html" style="color: var(--primary); font-weight: 600; text-decoration: none;">Sign Up</a>
    </div>
  </div>

  <script src="/js/config.js"></script>
  <script>
    function quickFill(user) {
      document.getElementById('username').value = user;
      document.getElementById('password').value = 'password123';
      handleLogin(new Event('submit'));
    }

    async function handleLogin(e) {
      if (e) e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const alertBox = document.getElementById('login-alert');
      const submitBtn = document.getElementById('btn-login-submit');

      alertBox.style.display = 'none';
      submitBtn.innerText = 'Logging in... ⏳';
      submitBtn.disabled = true;

      try {
        const resp = await AppConfig.fetch('/api/auth/login', {
          method: 'POST',
          body: JSON.stringify({ username, password })
        });

        const data = await resp.json();
        if (resp.ok && data.success) {
          window.location.href = '/chats.html';
        } else {
          alertBox.innerText = data.message || 'Invalid username or password.';
          alertBox.style.display = 'block';
          submitBtn.innerText = 'Log In';
          submitBtn.disabled = false;
        }
      } catch (err) {
        alertBox.innerText = 'Could not connect to backend. Please check your connection.';
        alertBox.style.display = 'block';
        submitBtn.innerText = 'Log In';
        submitBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
