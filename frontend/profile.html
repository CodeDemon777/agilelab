<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Settings - AgileLab</title>
  <meta name="description" content="View and manage user profile details, status quote, avatar, and security credentials in AgileLab.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/ProfilePage.css">
</head>
<body>
  <!-- Navigation Header -->
  <nav class="app-navbar" role="navigation" aria-label="Main Navigation">
    <div style="display:flex; align-items:center; gap: 0.85rem;">
      <button type="button" class="mobile-nav-toggle" id="mobile-nav-toggle" aria-label="Toggle navigation menu" aria-expanded="false" onclick="toggleMobileNav()">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
      <a href="index.html" class="brand-container" title="AgileLab Home">
        <div class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            <path d="M8 10h.01"></path>
            <path d="M12 10h.01"></path>
            <path d="M16 10h.01"></path>
          </svg>
        </div>
        <span class="brand-name">AgileLab</span>
        <span class="brand-badge">PRO</span>
      </a>
    </div>

    <ul class="nav-links" id="main-nav-links">
      <li>
        <a href="chats.html" class="nav-link">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          </svg>
          <span>Chats</span>
        </a>
      </li>
      <li>
        <a href="ai-workspace.html" class="nav-link ai-nav-pill">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"></path>
          </svg>
          <span>AI Intelligence</span>
        </a>
      </li>
      <li>
        <a href="notifications.html" class="nav-link">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
          <span>Notifications</span>
        </a>
      </li>
    </ul>
    <div style="display:flex; align-items:center; gap: 0.75rem;">
      <button onclick="App.logout()" class="nav-logout-btn" aria-label="Log Out">Log Out</button>
    </div>
  </nav>

  <div class="profile-container">
    <div class="profile-card">
      <img id="profile-display-avatar" src="/images/default-avatar.svg" class="profile-avatar-big" alt="User Avatar">
      <h2 id="profile-display-name" class="profile-display-name">Loading Profile...</h2>
      <p id="profile-display-username" class="profile-display-username">@username</p>
      <p id="profile-display-quote" class="profile-display-quote">"Living the dream"</p>

      <div id="profile-save-alert" style="display:none; padding:8px 12px; border-radius:var(--radius-sm); margin-bottom:1rem; font-size:0.88rem;"></div>

      <form id="profile-form" onsubmit="saveProfile(event)" style="text-align: left; border-top: 1px solid var(--border-color); padding-top: 1.5rem;">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" id="input-full-name" class="input-field" required>
        </div>

        <div class="form-group">
          <label class="form-label">Status Quote / Headline</label>
          <input type="text" id="input-status-quote" class="input-field" placeholder="e.g. Architecting real-time distributed systems">
        </div>

        <div class="form-group" style="margin-bottom: 1.5rem;">
          <label class="form-label">Choose Avatar Preset</label>
          <div style="display: flex; gap: 0.65rem; margin-bottom: 0.65rem; flex-wrap: wrap;">
            <img src="https://api.dicebear.com/7.x/bottts/svg?seed=JohnDoe" class="avatar-preset-btn" onclick="selectAvatar(this.src)" alt="Preset 1">
            <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Alice" class="avatar-preset-btn" onclick="selectAvatar(this.src)" alt="Preset 2">
            <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Bob" class="avatar-preset-btn" onclick="selectAvatar(this.src)" alt="Preset 3">
            <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Emma" class="avatar-preset-btn" onclick="selectAvatar(this.src)" alt="Preset 4">
            <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Felix" class="avatar-preset-btn" onclick="selectAvatar(this.src)" alt="Preset 5">
          </div>
          <input type="text" id="input-avatar-url" class="input-field" placeholder="Or paste custom image/avatar URL...">
        </div>

        <button type="submit" id="btn-save-profile" class="btn-submit">
          Save Changes
        </button>
      </form>
    </div>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/app.js"></script>
  <script>
    let currentProfile = null;

    async function loadUserProfile() {
      try {
        const res = await AppConfig.fetch('/api/auth/current');
        if (res.ok) {
          const user = await res.json();
          currentProfile = user;
          document.getElementById('profile-display-name').innerText = user.fullName || user.username;
          document.getElementById('profile-display-username').innerText = '@' + user.username;
          document.getElementById('profile-display-quote').innerText = user.statusQuote ? `"${user.statusQuote}"` : '"Collaborating on AgileLab"';
          if (user.avatarUrl) {
            document.getElementById('profile-display-avatar').src = user.avatarUrl;
          }

          document.getElementById('input-full-name').value = user.fullName || '';
          document.getElementById('input-status-quote').value = user.statusQuote || '';
          document.getElementById('input-avatar-url').value = user.avatarUrl || '';
        }
      } catch (e) {}
    }

    function selectAvatar(url) {
      document.getElementById('input-avatar-url').value = url;
      document.getElementById('profile-display-avatar').src = url;
    }

    async function saveProfile(e) {
      e.preventDefault();
      const fullName = document.getElementById('input-full-name').value.trim();
      const statusQuote = document.getElementById('input-status-quote').value.trim();
      const avatarUrl = document.getElementById('input-avatar-url').value.trim();
      const alertBox = document.getElementById('profile-save-alert');
      const saveBtn = document.getElementById('btn-save-profile');

      saveBtn.disabled = true;
      saveBtn.innerText = 'Saving...';
      alertBox.style.display = 'none';

      try {
        const res = await AppConfig.fetch('/api/users/profile', {
          method: 'POST',
          body: JSON.stringify({ fullName, statusQuote, avatarUrl })
        });
        if (res.ok) {
          alertBox.className = 'alert success';
          alertBox.innerText = 'Profile saved successfully!';
          alertBox.style.display = 'block';
          loadUserProfile();
        } else {
          alertBox.className = 'alert error';
          alertBox.innerText = 'Failed to save profile.';
          alertBox.style.display = 'block';
        }
      } catch (e) {
        alertBox.className = 'alert error';
        alertBox.innerText = 'Network error saving profile.';
        alertBox.style.display = 'block';
      } finally {
        saveBtn.disabled = false;
        saveBtn.innerText = 'Save Changes';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadUserProfile();
    });
  </script>
</body>
</html>
