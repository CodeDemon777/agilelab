<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - AgileLab</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <link rel="stylesheet" th:href="@{/css/LogIn.css}">
</head>
<body>
  <div class="login-page-container">
    <div class="login-card" style="max-width: 440px;">
      <div style="text-align: center; margin-bottom: 1.5rem;">
        <a th:href="@{/}" class="brand-container" style="justify-content: center; margin-bottom: 0.75rem;">
          <div class="brand-logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
              <path d="M8 10h.01"></path>
              <path d="M12 10h.01"></path>
              <path d="M16 10h.01"></path>
            </svg>
          </div>
          <span class="brand-name">AgileLab</span>
        </a>
        <h2 class="login-title">Create Your Account</h2>
        <p class="login-subtitle">Join your engineering team on AgileLab.</p>
      </div>

      <!-- Alerts -->
      <div th:if="${errorMessage != null}" class="alert error" th:text="${errorMessage}"></div>

      <form th:action="@{/signup}" th:object="${registerRequest}" method="post">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" th:field="*{fullName}" placeholder="e.g. Sarah Connor" class="input-field" required autofocus />
        </div>

        <div class="form-group">
          <label class="form-label">Username</label>
          <input type="text" th:field="*{username}" placeholder="e.g. sarahc" class="input-field" required />
        </div>

        <div class="form-group">
          <label class="form-label">Work Email</label>
          <input type="email" th:field="*{email}" placeholder="sarah@example.com" class="input-field" required />
        </div>

        <div class="form-group" style="margin-bottom: 1.5rem;">
          <label class="form-label">Password</label>
          <input type="password" th:field="*{password}" placeholder="At least 6 characters" class="input-field" required minlength="6" />
        </div>

        <button type="submit" class="btn-submit">Create Account</button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.88rem; color: var(--text-muted);">
        Already have an account? <a th:href="@{/login}" style="color: var(--primary); font-weight: 600; text-decoration: none;">Sign In</a>
      </div>
    </div>
  </div>
</body>
</html>
