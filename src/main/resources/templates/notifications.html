<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications - AgileLab</title>
  <link rel="stylesheet" th:href="@{/css/NotificationsPage.css}">
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <style>
    .notification {
      cursor: pointer;
      border-left: 4px solid transparent;
      transition: all 0.2s;
    }
    .notification:hover {
      box-shadow: 0 4px 10px rgba(0,0,0,0.12);
      transform: translateY(-2px);
    }
    .notification.unread {
      border-left-color: var(--primary);
      background-color: var(--primary-light);
    }
    .notification.read {
      border-left-color: #cbd5e1;
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <div th:replace="~{fragments/navbar :: navbar('notifications')}"></div>

  <div class="notifications-page" style="max-width: 760px; margin: 0 auto; width: 100%;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
      <h1 style="margin: 0; font-size: 1.8rem; color: #1e293b;">Notifications</h1>
      <button id="btn-mark-all-read" style="background: none; border: 1px solid #cbd5e1; padding: 0.45rem 0.9rem; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 600; color: #475569;">
        Mark all as read
      </button>
    </div>

    <ul class="notifications-list">
      <li th:each="n : ${notifications}"
          th:id="'notif-item-' + ${n.id}"
          class="notification"
          th:classappend="${n.read} ? 'read' : 'unread'"
          th:data-notif-id="${n.id}"
          th:data-link-url="${n.linkUrl}"
          onclick="NotificationsPage.handleItemClick(this)">

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
          <h4 style="margin: 0; font-size: 1.05rem; font-weight: 600; color: #1e293b;" th:text="${n.title}">Notification Title</h4>
          <span style="font-size: 0.78rem; color: #94a3b8;" th:text="${n.createdAt}">Just now</span>
        </div>
        <p style="margin: 0; font-size: 0.92rem; color: #475569;" th:text="${n.message}">Notification message detail...</p>
      </li>

      <li th:if="${notifications == null or #lists.isEmpty(notifications)}"
          style="text-align: center; padding: 3rem 1rem; color: #94a3b8; background: white; border-radius: 10px;">
        <span style="font-size: 2.5rem; display: block; margin-bottom: 0.5rem;">🎉</span>
        <h3 style="margin: 0 0 6px 0;">All caught up!</h3>
        <p style="margin: 0; font-size: 0.9rem;">You have no new notifications.</p>
      </li>
    </ul>
  </div>

  <!-- Scripts -->
  <script th:src="@{/js/sockjs.min.js}"></script>
  <script th:src="@{/js/stomp.min.js}"></script>
  <script th:src="@{/js/app.js}"></script>
  <script th:src="@{/js/notifications.js}"></script>
</body>
</html>
