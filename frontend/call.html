<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebRTC Video &amp; Voice Huddle - AgileLab</title>
  <meta name="description" content="Encrypted peer-to-peer WebRTC video and voice call session with screen sharing and speech transcription notes.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/CallPage.css">
  <style>
    body {
      background-color: #090d16;
      color: #f8fafc;
    }
  </style>
</head>
<body class="call-body">
  <!-- Navigation Header -->
  <nav class="app-navbar" style="background: rgba(15, 23, 42, 0.95); border-bottom: 1px solid rgba(255, 255, 255, 0.08);">
    <a href="index.html" class="brand-container" title="AgileLab Home">
      <div class="brand-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          <path d="M8 10h.01"></path>
          <path d="M12 10h.01"></path>
          <path d="M16 10h.01"></path>
        </svg>
      </div>
      <span class="brand-name" style="color:white;">AgileLab</span>
      <span class="brand-badge" style="background: rgba(255, 255, 255, 0.1); color: #cbd5e1; border-color: rgba(255,255,255,0.15);">HUDDLE</span>
    </a>
    <ul class="nav-links">
      <li>
        <a href="chats.html" class="nav-link" style="color:#94a3b8; display:flex; align-items:center; gap:0.4rem;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          </svg>
          <span>Back to Chats</span>
        </a>
      </li>
      <li>
        <a href="ai-workspace.html" class="nav-link ai-nav-pill" style="display:flex; align-items:center; gap:0.4rem;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"></path>
          </svg>
          <span>AI Workspace</span>
        </a>
      </li>
    </ul>
  </nav>

  <!-- Video Viewport -->
  <div class="video-viewport">
    <div class="call-overlay-header">
      <div class="call-title-badge">
        <span style="width:8px; height:8px; border-radius:50%; background:#10b981; display:inline-block;"></span>
        <span id="call-partner-name">Connecting Huddle...</span>
        <span id="call-timer" style="opacity:0.75; font-size:0.8rem; margin-left:6px;">00:00</span>
      </div>
    </div>

    <!-- Remote Peer Video -->
    <video id="remote-video" autoplay playsinline></video>

    <!-- Local Self-View Video -->
    <video id="local-video" autoplay playsinline muted></video>
  </div>

  <!-- Call Controls Dock -->
  <div class="call-controls-bar">
    <button id="btn-toggle-mic" class="btn-call-ctrl" onclick="CallPage.toggleAudio()" style="display:inline-flex; align-items:center; gap:0.4rem;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
        <line x1="12" y1="19" x2="12" y2="22"></line>
      </svg>
      <span id="label-mic">Mute Mic</span>
    </button>
    <button id="btn-toggle-cam" class="btn-call-ctrl" onclick="CallPage.toggleVideo()" style="display:inline-flex; align-items:center; gap:0.4rem;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polygon points="23 7 16 12 23 17 23 7"></polygon>
        <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
      </svg>
      <span id="label-cam">Stop Video</span>
    </button>
    <button id="btn-share-screen" class="btn-call-ctrl" onclick="CallPage.shareScreen()" style="display:inline-flex; align-items:center; gap:0.4rem;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
        <line x1="8" y1="21" x2="16" y2="21"></line>
        <line x1="12" y1="17" x2="12" y2="21"></line>
      </svg>
      <span>Share Screen</span>
    </button>
    <button id="btn-live-transcribe" class="btn-call-ctrl" style="background: rgba(99, 102, 241, 0.2); border-color: rgba(99, 102, 241, 0.4); display:inline-flex; align-items:center; gap:0.4rem;" onclick="CallPage.toggleLiveTranscription()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"></path>
      </svg>
      <span id="label-transcribe">Speech-to-Text</span>
    </button>
    <button id="btn-end-call" class="btn-call-ctrl end-call" onclick="CallPage.endCall()" style="display:inline-flex; align-items:center; gap:0.4rem;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-3.33-2.67m-2.67-3.34a19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91"></path>
        <line x1="1" y1="1" x2="23" y2="23"></line>
      </svg>
      <span>Leave Huddle</span>
    </button>
  </div>

  <script src="/js/sockjs.min.js"></script>
  <script src="/js/stomp.min.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/call.js"></script>
</body>
</html>
