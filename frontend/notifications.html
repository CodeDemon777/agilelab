<!DOCTYPE html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/NotificationsPage.css">
</head>
<body>
  <!-- Navigation Header -->
  <nav class="app-navbar" role="navigation" aria-label="Main Navigation">
    <div style="display:flex; align-items:center; gap: 0.85rem;">
      <button type="button" class="mobile-nav-toggle" id="mobile-nav-toggle" aria-label="Toggle navigation menu" aria-expanded="false" onclick="toggleMobileNav()">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
      <a href="index.html" class="brand-container" title="AgileLab Home">
        <div class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            <path d="M8 10h.01"></path>
            <path d="M12 10h.01"></path>
            <path d="M16 10h.01"></path>
          </svg>
        </div>
        <span class="brand-name">AgileLab</span>
        <span class="brand-badge">PRO</span>
      </a>
    </div>

    <ul class="nav-links" id="main-nav-links">
      <li>
        <a href="chats.html" class="nav-link">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          </svg>
          <span>Chats</span>
        </a>
      </li>
      <li>
        <a href="ai-workspace.html" class="nav-link ai-nav-pill">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"></path>
          </svg>
          <span>AI Intelligence</span>
        </a>
      </li>
      <li>
        <a href="notifications.html" class="nav-link active" aria-current="page">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
          <span>Notifications</span>
          <span id="navbar-notif-badge" class="nav-badge" style="display:none;">0</span>
        </a>
      </li>
    </ul>

    <div style="display:flex; align-items:center; gap: 0.75rem;">
      <div id="navbar-user-profile" style="display:none; align-items:center; gap: 0.6rem;">
        <a href="profile.html" class="user-nav-profile">
          <img id="navbar-user-avatar" src="images/default-avatar.svg" class="nav-avatar" alt="Avatar">
          <span id="navbar-user-name">User</span>
        </a>
        <button onclick="App.logout()" class="nav-logout-btn" aria-label="Log Out">Log Out</button>
      </div>
    </div>
  </nav>

  <div class="notifications-page">
    <div class="notifications-header">
      <h1 class="notifications-title">Notifications</h1>
      <button class="btn-mark-all" onclick="markAllNotificationsRead()">
        Mark all as read
      </button>
    </div>

    <div id="notifications-list">
      <p style="text-align:center; padding:2rem; color:var(--text-light);">Loading notifications...</p>
    </div>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/app.js"></script>
  <script>
    async function loadNotifications() {
      const list = document.getElementById('notifications-list');
      try {
        const res = await AppConfig.fetch('/api/notifications');
        if (res.ok) {
          const notifs = await res.json();
          if (notifs.length === 0) {
            list.innerHTML = `
              <div style="text-align:center; padding:3.5rem 1rem; color:var(--text-light); background:white; border-radius:var(--radius-md); border:1px solid var(--border-color);">
                <div class="empty-state-icon" style="margin: 0 auto 1rem auto;" aria-hidden="true">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                  </svg>
                </div>
                <h3 style="margin:0 0 6px 0; font-size:1.1rem; color:var(--text-main);">All caught up!</h3>
                <p style="margin:0; font-size:0.88rem; color:var(--text-muted);">You have no unread notifications right now.</p>
              </div>
            `;
            return;
          }

          list.innerHTML = '';
          notifs.forEach(n => {
            const item = document.createElement('div');
            item.className = `notification-card ${n.read ? 'read' : 'unread'}`;
            item.onclick = async () => {
              if (!n.read) {
                await AppConfig.fetch(`/api/notifications/${n.id}/read`, { method: 'POST' });
              }
              if (n.linkUrl) window.location.href = n.linkUrl;
            };

            const timeStr = new Date(n.createdAt || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            item.innerHTML = `
              <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                <div>
                  <h4 style="margin:0 0 4px 0; font-size:0.95rem; font-weight:600; color:var(--text-main);">${n.title || 'New notification'}</h4>
                  <p style="margin:0; font-size:0.86rem; color:var(--text-muted);">${n.content || ''}</p>
                </div>
                <span style="font-size:0.75rem; color:var(--text-light); white-space:nowrap; margin-left:12px;">${timeStr}</span>
              </div>
            `;
            list.appendChild(item);
          });
        }
      } catch (e) {
        list.innerHTML = '<p style="text-align:center; color:var(--danger); padding:2rem;">Failed to load notifications.</p>';
      }
    }

    async function markAllNotificationsRead() {
      try {
        await AppConfig.fetch('/api/notifications/read-all', { method: 'POST' });
        loadNotifications();
        const badge = document.getElementById('navbar-notif-badge');
        if (badge) badge.style.display = 'none';
      } catch (e) {}
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadNotifications();
    });
  </script>
</body>
</html>
