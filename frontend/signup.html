<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - AgileLab Team Collaboration</title>
  <meta name="description" content="Create your AgileLab account to join your engineering team for high-velocity real-time chat, WebRTC video calls, and AI sprint intelligence.">
  <link rel="canonical" href="https://agilelab.onrender.com/signup">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/LogIn.css">
</head>
<body>
  <div class="login-page-container">
    <div class="login-card" style="max-width: 440px;">
      <div style="text-align: center; margin-bottom: 1.5rem;">
        <a href="index.html" class="brand-container" style="justify-content: center; margin-bottom: 0.75rem;" title="AgileLab Home">
          <div class="brand-logo" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
              <path d="M8 10h.01"></path>
              <path d="M12 10h.01"></path>
              <path d="M16 10h.01"></path>
            </svg>
          </div>
          <span class="brand-name">AgileLab</span>
        </a>
        <h1 class="login-title">Create Your Account</h1>
        <p class="login-subtitle">Join your engineering team on AgileLab.</p>
      </div>

      <!-- Alert Box -->
      <div id="signup-alert" class="alert error" style="display:none;"></div>

      <form id="signup-form" onsubmit="handleSignup(event)">
        <div class="form-group">
          <label for="fullName" class="form-label">Full Name</label>
          <input type="text" id="fullName" class="input-field" placeholder="e.g. Sarah Connor" required autofocus>
        </div>

        <div class="form-group">
          <label for="username" class="form-label">Username</label>
          <input type="text" id="username" class="input-field" placeholder="e.g. sarahc" required>
        </div>

        <div class="form-group">
          <label for="email" class="form-label">Work Email</label>
          <input type="email" id="email" class="input-field" placeholder="sarah@example.com" required>
        </div>

        <div class="form-group" style="margin-bottom: 1.5rem;">
          <label for="password" class="form-label">Password</label>
          <input type="password" id="password" class="input-field" placeholder="At least 6 characters" required minlength="6">
        </div>

        <button type="submit" id="btn-signup-submit" class="btn-submit">
          Create Account
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.88rem; color: var(--text-muted);">
        Already have an account? <a href="/login.html" style="color: var(--primary); font-weight: 600; text-decoration: none;">Sign In</a>
      </div>
    </div>
  </div>

  <script src="/js/config.js"></script>
  <script>
    async function handleSignup(e) {
      e.preventDefault();
      const fullName = document.getElementById('fullName').value.trim();
      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      const alertBox = document.getElementById('signup-alert');
      const submitBtn = document.getElementById('btn-signup-submit');

      alertBox.style.display = 'none';
      submitBtn.innerText = 'Creating account...';
      submitBtn.disabled = true;

      try {
        const resp = await AppConfig.fetch('/api/auth/register', {
          method: 'POST',
          body: JSON.stringify({ fullName, username, email, password })
        });

        const data = await resp.json();
        if (resp.ok && data.success) {
          const loginResp = await AppConfig.fetch('/api/auth/login', {
            method: 'POST',
            body: JSON.stringify({ username, password })
          });
          if (loginResp.ok) {
            window.location.href = '/chats.html';
          } else {
            window.location.href = '/login.html?registered=true';
          }
        } else {
          alertBox.innerText = data.message || 'Registration failed. Please check inputs.';
          alertBox.style.display = 'block';
          submitBtn.innerText = 'Create Account';
          submitBtn.disabled = false;
        }
      } catch (err) {
        alertBox.innerText = 'Could not connect to backend. Please check connection.';
        alertBox.style.display = 'block';
        submitBtn.innerText = 'Create Account';
        submitBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
