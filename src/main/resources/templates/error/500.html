<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>500 - Server Error | AgileLab</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <style>
    .error-container {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 1.5rem;
    }
    .error-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 3rem 2.5rem;
      max-width: 500px;
      width: 100%;
      box-shadow: var(--shadow-md);
    }
    .error-icon-box {
      width: 72px;
      height: 72px;
      margin: 0 auto 1.5rem;
      background: #fef2f2;
      color: var(--danger);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .error-code {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--danger);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 0.5rem;
    }
    .error-title {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--text-main);
      margin: 0 0 0.75rem;
      letter-spacing: -0.025em;
    }
    .error-message {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 2rem;
    }
    .error-actions {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <nav class="app-navbar">
    <a th:href="@{/}" class="brand-container">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          <path d="M8 10h.01"></path>
          <path d="M12 10h.01"></path>
          <path d="M16 10h.01"></path>
        </svg>
      </div>
      <span class="brand-name">AgileLab</span>
    </a>
  </nav>

  <main class="error-container">
    <div class="error-card">
      <div class="error-icon-box" aria-hidden="true">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
          <line x1="12" y1="9" x2="12" y2="13"></line>
          <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
      </div>
      <div class="error-code">Error 500</div>
      <h1 class="error-title">Unexpected Service Error</h1>
      <p class="error-message">Our system encountered a temporary error while processing your request. Our telemetry logging has recorded this event.</p>
      <div class="error-actions">
        <a th:href="@{/chats}" class="btn btn-primary" style="padding: 0.65rem 1.4rem;">Return to Workspace</a>
        <a th:href="@{/}" class="btn btn-secondary" style="padding: 0.65rem 1.25rem;">Back to Home</a>
      </div>
    </div>
  </main>
</body>
</html>
