<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In - AgileLab</title>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/LogIn.css">
</head>
<body>
  <div class="login-page-container">
    <div class="login-card">
      <div style="text-align: center; margin-bottom: 1.5rem;">
        <a href="/index.html" class="brand-container" style="justify-content: center; margin-bottom: 0.75rem;">
          <div class="brand-logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
              <path d="M8 10h.01"></path>
              <path d="M12 10h.01"></path>
              <path d="M16 10h.01"></path>
            </svg>
          </div>
          <span class="brand-name">AgileLab</span>
        </a>
        <h2 class="login-title">Welcome Back</h2>
        <p class="login-subtitle">Sign in to access your team chat and sprint intelligence.</p>
      </div>

      <!-- Alert Box -->
      <div id="login-alert" class="alert error" style="display:none;"></div>

      <!-- 1-Click Demo Credentials -->
      <div class="demo-box">
        <p class="demo-title">⚡ 1-Click Instant Demo Login:</p>
        <div style="display: flex; gap: 0.4rem; flex-wrap: wrap;">
          <button type="button" class="demo-user-pill" onclick="quickFill('johndoe')">John Doe</button>
          <button type="button" class="demo-user-pill" onclick="quickFill('alice')">Alice</button>
          <button type="button" class="demo-user-pill" onclick="quickFill('bob')">Bob</button>
          <button type="button" class="demo-user-pill" onclick="quickFill('emma')">Emma</button>
        </div>
      </div>

      <!-- Login Form -->
      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="username" class="form-label">Username or Email</label>
          <input type="text" id="username" class="input-field" placeholder="Enter username or email..." required autofocus>
        </div>

        <div class="form-group" style="margin-bottom: 1.5rem;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 0.35rem;">
            <label for="password" class="form-label" style="margin: 0;">Password</label>
            <span style="font-size: 0.78rem; color: var(--text-light);">demo: password123</span>
          </div>
          <input type="password" id="password" class="input-field" placeholder="••••••••" required>
        </div>

        <button type="submit" id="btn-login-submit" class="btn-submit">
          Sign In
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.88rem; color: var(--text-muted);">
        Don't have an account? <a href="/signup.html" style="color: var(--primary); font-weight: 600; text-decoration: none;">Create one free</a>
      </div>
    </div>
  </div>

  <script src="/js/config.js"></script>
  <script>
    function quickFill(user) {
      document.getElementById('username').value = user;
      document.getElementById('password').value = 'password123';
      handleLogin(new Event('submit'));
    }

    async function handleLogin(e) {
      if (e) e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const alertBox = document.getElementById('login-alert');
      const submitBtn = document.getElementById('btn-login-submit');

      alertBox.style.display = 'none';
      submitBtn.innerText = 'Signing in...';
      submitBtn.disabled = true;

      try {
        const resp = await AppConfig.fetch('/api/auth/login', {
          method: 'POST',
          body: JSON.stringify({ username, password })
        });

        const data = await resp.json();
        if (resp.ok && data.success) {
          window.location.href = '/chats.html';
        } else {
          alertBox.innerText = data.message || 'Invalid username or password.';
          alertBox.style.display = 'block';
          submitBtn.innerText = 'Sign In';
          submitBtn.disabled = false;
        }
      } catch (err) {
        alertBox.innerText = 'Could not connect to backend. Please check connection.';
        alertBox.style.display = 'block';
        submitBtn.innerText = 'Sign In';
        submitBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
