<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In - AgileLab</title>
  <link rel="stylesheet" th:href="@{/css/LogIn.css}">
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <style>
    .demo-users-box {
      margin-top: 1.5rem;
      padding: 1rem;
      background: #f8fafc;
      border-radius: 8px;
      border: 1px dashed #cbd5e1;
      font-size: 0.85rem;
      text-align: left;
    }
    .demo-pill {
      display: inline-block;
      padding: 4px 8px;
      margin: 3px;
      background: #e2e8f0;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      color: #334155;
      transition: background 0.2s;
    }
    .demo-pill:hover {
      background: #00bfff;
      color: white;
    }
    .alert-msg {
      padding: 0.75rem;
      border-radius: 6px;
      margin-bottom: 1rem;
      font-size: 0.9rem;
    }
    .alert-danger {
      background-color: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }
    .alert-success {
      background-color: #dcfce7;
      color: #166534;
      border: 1px solid #bbf7d0;
    }
  </style>
</head>
<body>
  <div class="form-page" style="max-width: 420px; width: 90%;">
    <div style="font-size: 2.2rem; margin-bottom: 0.5rem;">💬</div>
    <h1 class="form-title" style="margin-top:0;">Log In</h1>

    <!-- Alerts -->
    <div th:if="${errorMessage != null}" class="alert-msg alert-danger" th:text="${errorMessage}"></div>
    <div th:if="${successMessage != null}" class="alert-msg alert-success" th:text="${successMessage}"></div>

    <form class="login-signup-form" th:action="@{/login}" method="post">
      <input type="text" id="username-field" name="username" placeholder="Username or Email" class="input-field" required autofocus />
      <input type="password" id="password-field" name="password" placeholder="Password" class="input-field" required />
      <button type="submit" class="btn-submit" style="width: 100%; margin-top: 0.5rem;">Log In</button>
    </form>

    <p class="alternate-option">Don't have an account? <a th:href="@{/signup}">Sign Up</a></p>

    <!-- Quick Demo Accounts -->
    <div class="demo-users-box">
      <div style="font-weight: 700; margin-bottom: 6px; color: #475569;">🚀 Quick Demo Accounts (Click to fill):</div>
      <div>
        <span class="demo-pill" onclick="fillDemo('johndoe', 'password123')">John Doe</span>
        <span class="demo-pill" onclick="fillDemo('alice', 'password123')">Alice Smith</span>
        <span class="demo-pill" onclick="fillDemo('bob', 'password123')">Bob Wilson</span>
        <span class="demo-pill" onclick="fillDemo('emma', 'password123')">Emma Davis</span>
      </div>
      <div style="margin-top: 6px; font-size: 0.78rem; color: #64748b;">Password for all demo accounts: <code>password123</code></div>
    </div>
  </div>

  <script>
    function fillDemo(username, password) {
      document.getElementById('username-field').value = username;
      document.getElementById('password-field').value = password;
    }
  </script>
</body>
</html>
