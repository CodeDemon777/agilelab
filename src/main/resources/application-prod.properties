server.port=${PORT:10000}
server.forward-headers-strategy=framework
spring.application.name=AgileLabChatApp

# H2 Database Configuration for Production
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/agilelabdb;AUTO_SERVER=TRUE;AUTO_RECONNECT=TRUE}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Disable H2 web console in production for security
spring.h2.console.enabled=false

# Thymeleaf caching enabled in prod
spring.thymeleaf.cache=true
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Servlet & Multipart settings
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.com.agilelab.chatapp=INFO
