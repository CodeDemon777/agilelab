<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head></head>

<body>
    <nav th:fragment="navbar(activeTab)" class="app-navbar">
        <a href="/chats" class="brand-container">
            <div class="brand-logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    <path d="M8 10h.01"></path>
                    <path d="M12 10h.01"></path>
                    <path d="M16 10h.01"></path>
                </svg>
            </div>
            <span class="brand-name">AgileLab</span>
            <span class="brand-badge">PRO</span>
        </a>

        <ul class="nav-links">
            <li>
                <a href="/chats" class="nav-link" th:classappend="${activeTab == 'chats'} ? 'active' : ''">
                    <span>💬 Chats</span>
                </a>
            </li>
            <li>
                <a href="/ai-workspace" class="nav-link ai-nav-pill"
                    th:classappend="${activeTab == 'ai-workspace'} ? 'active' : ''">
                    <span>⚡ AI Intelligence</span>
                </a>
            </li>
            <li>
                <a href="/notifications" class="nav-link"
                    th:classappend="${activeTab == 'notifications'} ? 'active' : ''">
                    <span>🔔 Notifications</span>
                    <span id="navbar-notif-badge" class="nav-badge"
                        th:style="${unreadCount != null and unreadCount > 0} ? 'display:inline-block;' : 'display:none;'"
                        th:text="${unreadCount != null ? unreadCount : 0}">0</span>
                </a>
            </li>
        </ul>

        <div style="display:flex; align-items:center; gap: 0.75rem;" th:if="${currentUser != null}">
            <a href="/profile" class="user-nav-profile" title="View Profile">
                <div class="nav-avatar-wrap">
                    <img th:src="${currentUser.avatarUrl}" class="nav-avatar" alt="Avatar">
                    <span class="presence-dot online" th:data-user-presence="${currentUser.username}"></span>
                </div>
                <span style="font-weight:600; font-size:0.88rem;" th:text="${currentUser.fullName}">User</span>
            </a>

            <form th:action="@{/logout}" method="post" style="margin:0;">
                <button type="submit" class="nav-logout-btn">Log Out</button>
            </form>
        </div>
    </nav>
</body>

</html>
