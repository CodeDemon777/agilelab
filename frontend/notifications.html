<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications - AgileLab</title>
  <link rel="stylesheet" href="/css/NotificationsPage.css">
  <link rel="stylesheet" href="/css/app.css">
  <style>
    .notification {
      cursor: pointer;
      border-left: 4px solid transparent;
      transition: all 0.2s;
      background: white;
      padding: 1rem 1.25rem;
      border-radius: 10px;
      margin-bottom: 0.75rem;
      border: 1px solid #e2e8f0;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }
    .notification:hover {
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      transform: translateY(-2px);
    }
    .notification.unread {
      border-left-color: #00bfff;
      background-color: #f0f9ff;
    }
    .notification.read {
      border-left-color: #cbd5e1;
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <!-- Navigation Header -->
  <nav class="app-navbar">
    <a href="/index.html" class="brand-container">
      <div class="brand-logo">💬</div>
      <span class="brand-name">AgileLab</span>
    </a>
    <ul class="nav-links">
      <li><a href="/chats.html" class="nav-link"><span>💬 Chats</span></a></li>
      <li><a href="/ai-workspace.html" class="nav-link ai-nav-pill"><span>✨ AI Workspace</span></a></li>
      <li><a href="/notifications.html" class="nav-link active"><span>🔔 Notifications</span><span id="navbar-notif-badge" class="nav-badge" style="display:none;">0</span></a></li>
    </ul>
    <div style="display:flex; align-items:center; gap: 1rem;">
      <div id="navbar-user-profile" style="display:none; align-items:center; gap: 0.6rem;">
        <a href="/profile.html" class="user-nav-profile">
          <img id="navbar-user-avatar" src="/images/default-avatar.svg" class="nav-avatar" style="width:30px; height:30px; border-radius:50%;">
          <span id="navbar-user-name" style="font-weight:600; font-size:0.9rem;">User</span>
        </a>
        <button onclick="App.logout()" class="nav-logout-btn">Log Out</button>
      </div>
    </div>
  </nav>

  <div class="notifications-page" style="max-width: 760px; margin: 2rem auto; width: 100%; padding: 0 1rem;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
      <h1 style="margin: 0; font-size: 1.8rem; color: #1e293b;">Notifications</h1>
      <button onclick="markAllNotificationsRead()" style="background: white; border: 1px solid #cbd5e1; padding: 0.45rem 0.9rem; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 600; color: #475569;">
        Mark all as read
      </button>
    </div>

    <div id="notifications-list">
      <p style="text-align:center; padding:2rem; color:#64748b;">Loading notifications... ⏳</p>
    </div>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/app.js"></script>
  <script>
    async function loadNotifications() {
      const list = document.getElementById('notifications-list');
      try {
        const res = await AppConfig.fetch('/api/notifications');
        if (res.ok) {
          const notifs = await res.json();
          if (notifs.length === 0) {
            list.innerHTML = `
              <div style="text-align:center; padding:3rem 1rem; color:#94a3b8; background:white; border-radius:10px;">
                <span style="font-size:2.5rem; display:block; margin-bottom:0.5rem;">🎉</span>
                <h3 style="margin:0 0 6px 0;">All caught up!</h3>
                <p style="margin:0; font-size:0.85rem;">No new notifications right now.</p>
              </div>
            `;
            return;
          }

          list.innerHTML = '';
          notifs.forEach(n => {
            const item = document.createElement('div');
            item.className = `notification ${n.read ? 'read' : 'unread'}`;
            item.onclick = async () => {
              if (!n.read) {
                await AppConfig.fetch(`/api/notifications/${n.id}/read`, { method: 'POST' });
              }
              if (n.linkUrl) window.location.href = n.linkUrl;
            };
            item.innerHTML = `
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
                <strong style="font-size:1.02rem; color:#0f172a;">${escapeHtml(n.title)}</strong>
                <span style="font-size:0.75rem; color:#94a3b8;">${escapeHtml(n.createdAt || '')}</span>
              </div>
              <p style="margin:0; font-size:0.9rem; color:#475569;">${escapeHtml(n.message)}</p>
            `;
            list.appendChild(item);
          });
        }
      } catch (e) {
        list.innerHTML = '<p style="text-align:center; color:#ef4444;">Failed to load notifications.</p>';
      }
    }

    async function markAllNotificationsRead() {
      try {
        await AppConfig.fetch('/api/notifications/read-all', { method: 'POST' });
        loadNotifications();
        const badge = document.getElementById('navbar-notif-badge');
        if (badge) badge.style.display = 'none';
      } catch (e) {}
    }

    function escapeHtml(text) {
      if (!text) return '';
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
      return String(text).replace(/[&<>"']/g, m => map[m]);
    }

    document.addEventListener('DOMContentLoaded', () => loadNotifications());
  </script>
</body>
</html>
